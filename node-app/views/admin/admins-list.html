<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>管理员管理</title>
  <link href="/spck/css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <table width="98%" border="0" cellspacing="0" cellpadding="0" align="center" class="tableBorder">
    <tr><th height="25" colspan="2" class="tableHeaderText">管理员管理</th></tr>
    <tr><td colspan="2" class="forumRowHighlight"><p><b>注意</b>：不能删除当前登录的管理员账号。</p></td></tr>
    <tr>
      <td width="9%" height="25" class="forumRowHighlight">&nbsp;</td>
      <td width="91%" class="forumRowHighlight">
        <a href="/admin/admins">管理员列表</a> |
        <a href="/admin/admins/add">添加管理员</a> |
        [<a href="javascript:location.reload()">刷新页面</a>]
      </td>
    </tr>
  </table>

  <form method="post" action="/admin/admins/delete" id="deleteForm">
    <table width="100%" border="0" align="center" cellpadding="2" cellspacing="1" class="tableBorder">
      <tr><th class="tableHeaderText" height="25" colspan="6">管理员列表</th></tr>
      <tr height="25" class="bodytitle">
        <td width="60" align="center">ID</td>
        <td width="150" align="left"><b>用户名</b></td>
        <td width="250" align="left"><b>权限标识</b></td>
        <td width="150" align="center"><b>创建时间</b></td>
        <td width="80" align="center"><b>操作</b></td>
        <td width="100" align="center"><input name="submit2" type="submit" value="删除"></td>
      </tr>
      <tbody id="adminRows">
        <tr><td colspan="6" class="forumRow" align="center">加载中...</td></tr>
      </tbody>
      <tr height="20" bgcolor="#ffffff">
        <td colspan="5" class="forumRow" align="right">&nbsp;</td>
        <td class="forumRow" align="center"><input name="button" type="button" onclick="toggleAll()" value="全选"></td>
      </tr>
      <tr height="20" bgcolor="#ffffff">
        <td class="forumrowHighLight" align="center" colspan="6" id="pagination">
          共 0 条
        </td>
      </tr>
    </table>
  </form>

  <script>
    let checkFlag = false;
    let currentUserId = null;

    function toggleAll() {
      const checkboxes = document.querySelectorAll('input[name="selAdmin"]');
      checkFlag = !checkFlag;
      checkboxes.forEach(cb => cb.checked = checkFlag);
    }

    async function loadAdmins() {
      try {
        // 先获取当前用户信息
        const meResponse = await fetch('/api/admin/me');
        const meData = await meResponse.json();
        if (meData.success && meData.data) {
          currentUserId = meData.data.id;
        }

        // 获取管理员列表
        const response = await fetch('/api/admin/list');
        const data = await response.json();

        if (!data.success || !data.data) {
          throw new Error('加载失败');
        }

        renderAdmins(data.data);
      } catch (error) {
        document.getElementById('adminRows').innerHTML =
          '<tr><td colspan="6" class="forumRow" align="center" style="color:red;">加载失败：' + error.message + '</td></tr>';
      }
    }

    function renderAdmins(admins) {
      const tbody = document.getElementById('adminRows');

      if (admins.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="forumRow" align="center">暂无管理员</td></tr>';
        return;
      }

      const rows = admins.map(item => {
        const isCurrent = item.id === currentUserId;
        const deleteCheckbox = isCurrent ?
          '<span style="color:#999;">当前用户</span>' :
          `<input type="checkbox" name="selAdmin" value="${item.id}">`;

        return `
          <tr height="20">
            <td align="center" class="forumRow">${item.id}</td>
            <td align="left" class="forumRow">&nbsp;${escapeHtml(item.username || '')}${isCurrent ? ' <span style="color:#0B55D2;">(当前)</span>' : ''}</td>
            <td align="left" class="forumRow">${escapeHtml(item.permission_flags || '')}</td>
            <td align="center" class="forumRow">${escapeHtml(item.created_at || '')}</td>
            <td align="center" class="forumRow">
              <a href="/admin/admins/edit?id=${item.id}">修改</a> |
              <a href="/admin/admins/password?id=${item.id}">改密</a>
            </td>
            <td align="center" class="forumRow">${deleteCheckbox}</td>
          </tr>
        `;
      }).join('');

      tbody.innerHTML = rows;
      document.getElementById('pagination').innerHTML = `共 ${admins.length} 条`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('deleteForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const selected = Array.from(document.querySelectorAll('input[name="selAdmin"]:checked'))
        .map(cb => cb.value);

      if (selected.length === 0) {
        alert('请选择要删除的管理员');
        return;
      }

      if (!confirm(`确定要删除选中的 ${selected.length} 个管理员吗？`)) {
        return;
      }

      try {
        const promises = selected.map(id =>
          fetch(`/api/admin/${id}`, { method: 'DELETE' })
        );
        await Promise.all(promises);
        alert('删除成功');
        loadAdmins();
      } catch (error) {
        alert('删除失败：' + error.message);
      }
    });

    loadAdmins();
  </script>
</body>
</html>
