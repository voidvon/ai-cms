<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>联系方式管理</title>
  <link href="/spck/css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <table width="98%" border="0" cellspacing="0" cellpadding="0" align="center" class="tableBorder">
    <tr><th height="25" colspan="2" class="tableHeaderText">联系方式管理</th></tr>
    <tr><td colspan="2" class="forumRowHighlight"><p><b>注意</b>：办事处联系方式会显示在网站前台。</p></td></tr>
    <tr>
      <td width="9%" height="25" class="forumRowHighlight">&nbsp;</td>
      <td width="91%" class="forumRowHighlight">
        <a href="/admin/contacts">管理联系方式</a> |
        <a href="/admin/contacts/add">添加联系方式</a> |
        [<a href="javascript:location.reload()">刷新页面</a>]
      </td>
    </tr>
  </table>

  <form method="post" action="/admin/contacts/delete" id="deleteForm">
    <table width="100%" border="0" align="center" cellpadding="2" cellspacing="1" class="tableBorder">
      <tr><th class="tableHeaderText" height="25" colspan="8">联系方式列表</th></tr>
      <tr height="25" class="bodytitle">
        <td width="43" align="center">ID</td>
        <td width="150" align="left"><b>办事处名称</b></td>
        <td width="200" align="left"><b>地址</b></td>
        <td width="100" align="center"><b>电话</b></td>
        <td width="100" align="center"><b>传真</b></td>
        <td width="62" align="center"><b>排序</b></td>
        <td width="59" align="center"><b>修改</b></td>
        <td width="100" align="center"><input name="submit2" type="submit" value="删除"></td>
      </tr>
      <tbody id="contactRows">
        <tr><td colspan="8" class="forumRow" align="center">加载中...</td></tr>
      </tbody>
      <tr height="20" bgcolor="#ffffff">
        <td colspan="7" class="forumRow" align="right">&nbsp;</td>
        <td class="forumRow" align="center"><input name="button" type="button" onclick="toggleAll()" value="全选"></td>
      </tr>
      <tr height="20" bgcolor="#ffffff">
        <td class="forumrowHighLight" align="center" colspan="8" id="pagination">
          第 1 / 1 页，共 0 条
        </td>
      </tr>
    </table>
  </form>

  <script>
    let checkFlag = false;
    function toggleAll() {
      const checkboxes = document.querySelectorAll('input[name="selContact"]');
      checkFlag = !checkFlag;
      checkboxes.forEach(cb => cb.checked = checkFlag);
    }

    async function loadContacts() {
      try {
        const response = await fetch('/api/contacts');
        const data = await response.json();

        if (!data.success || !data.data) {
          throw new Error('加载失败');
        }

        renderContacts(data.data);
      } catch (error) {
        document.getElementById('contactRows').innerHTML =
          '<tr><td colspan="8" class="forumRow" align="center" style="color:red;">加载失败：' + error.message + '</td></tr>';
      }
    }

    function renderContacts(contacts) {
      const tbody = document.getElementById('contactRows');

      if (contacts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="forumRow" align="center">暂无联系方式</td></tr>';
        return;
      }

      const rows = contacts.map(item => `
        <tr height="20">
          <td align="center" class="forumRow">${item.id}</td>
          <td align="left" class="forumRow">&nbsp;${escapeHtml(item.office_name || '')}</td>
          <td align="left" class="forumRow">${escapeHtml(item.address || '')}</td>
          <td align="center" class="forumRow">${escapeHtml(item.phone || '')}</td>
          <td align="center" class="forumRow">${escapeHtml(item.fax || '')}</td>
          <td align="center" class="forumRow">${item.sort_order ?? 0}</td>
          <td align="center" class="forumRow"><a href="/admin/contacts/edit?id=${item.id}">修改</a></td>
          <td align="center" class="forumRow"><input type="checkbox" name="selContact" value="${item.id}"></td>
        </tr>
      `).join('');

      tbody.innerHTML = rows;
      document.getElementById('pagination').innerHTML = `共 ${contacts.length} 条`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('deleteForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const selected = Array.from(document.querySelectorAll('input[name="selContact"]:checked'))
        .map(cb => cb.value);

      if (selected.length === 0) {
        alert('请选择要删除的联系方式');
        return;
      }

      if (!confirm(`确定要删除选中的 ${selected.length} 条联系方式吗？`)) {
        return;
      }

      try {
        const promises = selected.map(id =>
          fetch(`/api/contacts/${id}`, { method: 'DELETE' })
        );
        await Promise.all(promises);
        alert('删除成功');
        loadContacts();
      } catch (error) {
        alert('删除失败：' + error.message);
      }
    });

    loadContacts();
  </script>
</body>
</html>
