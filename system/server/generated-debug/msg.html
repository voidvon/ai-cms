<!DOCTYPE html><html lang="zh-CN"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>在线留言 - 斯派莎克阀门制造有限公司</title><style>body{margin:0;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#f8fafc;color:#0f172a;}a{color:#2563eb;text-decoration:none;}main{max-width:900px;margin:0 auto;padding:28px 20px 64px;} .breadcrumb{color:#64748b;font-size:14px;} form{margin-top:20px;background:#fff;border:1px solid #dbe3f0;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(15,23,42,.04);} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;} label{display:block;font-size:14px;color:#475569;margin-bottom:8px;} input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;font:inherit;background:#fff;} textarea{min-height:160px;resize:vertical;} button{margin-top:18px;border:0;border-radius:12px;padding:12px 20px;background:#2563eb;color:#fff;font:inherit;cursor:pointer;} .tips{margin-top:16px;color:#64748b;font-size:14px;} @media (max-width:700px){.grid{grid-template-columns:1fr;}}</style></head><body><main><nav class="breadcrumb"><span><a href="/index.html">公司主页</a></span><span> / <span>在线留言</span></span></nav><h1>在线留言</h1><form id="default-message-form"><div class="grid"><div><label for="contact_name">姓名</label><input id="contact_name" required="" name="contact_name"/></div><div><label for="phone">电话</label><input id="phone" required="" name="phone"/></div><div><label for="email">邮箱</label><input id="email" type="email" name="email"/></div><div><label for="title">主题</label><input id="title" required="" name="title"/></div></div><div style="margin-top:16px"><label for="content">内容</label><textarea id="content" name="content"></textarea></div><button type="submit">提交留言</button><div class="tips">联系电话：021-51602737 ｜ 邮箱：liuyun@spiraxsarcocn.com</div></form><script>document.addEventListener('DOMContentLoaded',function(){var form=document.getElementById('default-message-form');if(!form)return;form.addEventListener('submit',async function(event){event.preventDefault();var body=new URLSearchParams(new FormData(form)).toString();var response=await fetch('/ajaxcode/msg?action=msgadd',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body});if(response.ok){alert('留言提交成功');form.reset();}else{var text=await response.text();alert(text||'留言提交失败');}});});</script></main></body></html>
