<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>修改密码</title>
  <link href="/spck/css/style.css" rel="stylesheet" type="text/css">
  <style>
    .form-row { margin: 10px 0; }
    .form-row label { display: inline-block; width: 120px; text-align: right; padding-right: 10px; }
    .form-row input[type="password"] { width: 300px; padding: 5px; }
    .form-actions { margin: 20px 0 0 130px; }
  </style>
</head>
<body>
  <form id="passwordForm">
    <table width="98%" border="0" cellspacing="0" cellpadding="0" align="center" class="tableBorder">
      <tr><th height="25" class="tableHeaderText">修改管理员密码</th></tr>
      <tr>
        <td class="forumRowHighlight">
          <div class="form-row">
            <label>用户名：</label>
            <span id="username" style="font-weight: bold;"></span>
          </div>
          <div class="form-row">
            <label><span style="color:red;">*</span> 新密码：</label>
            <input type="password" name="password" id="password" required>
            <span style="color: #999; font-size: 11px;">至少6位</span>
          </div>
          <div class="form-row">
            <label><span style="color:red;">*</span> 确认密码：</label>
            <input type="password" name="password_confirm" id="password_confirm" required>
          </div>
          <div class="form-actions">
            <input type="submit" value="保存" class="button">
            <input type="button" value="返回" onclick="history.back()" class="button">
          </div>
        </td>
      </tr>
    </table>
  </form>

  <script>
    let adminId = null;

    async function loadAdmin(id) {
      try {
        const response = await fetch(`/api/admin/${id}`);
        const data = await response.json();

        if (data.success && data.data) {
          document.getElementById('username').textContent = data.data.username;
        }
      } catch (error) {
        alert('加载管理员信息失败：' + error.message);
      }
    }

    document.getElementById('passwordForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password_confirm').value;

      if (password.length < 6) {
        alert('密码至少6位');
        return;
      }

      if (password !== passwordConfirm) {
        alert('两次输入的密码不一致');
        return;
      }

      try {
        const response = await fetch(`/api/admin/${adminId}/password`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (data.success) {
          alert('修改成功');
          window.location.href = '/admin/admins';
        } else {
          alert('修改失败：' + (data.message || '未知错误'));
        }
      } catch (error) {
        alert('修改失败：' + error.message);
      }
    });

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      adminId = urlParams.get('id');

      if (!adminId) {
        alert('缺少管理员ID');
        history.back();
        return;
      }

      loadAdmin(adminId);
    }

    init();
  </script>
</body>
</html>
