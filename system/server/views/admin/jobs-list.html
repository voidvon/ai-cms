<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>招聘管理</title>
  <link href="/spck/css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <table width="98%" border="0" cellspacing="0" cellpadding="0" align="center" class="tableBorder">
    <tr><th height="25" colspan="2" class="tableHeaderText">招聘管理</th></tr>
    <tr><td colspan="2" class="forumRowHighlight"><p><b>注意</b>：删除招聘信息后不可恢复。</p></td></tr>
    <tr>
      <td width="9%" height="25" class="forumRowHighlight">&nbsp;</td>
      <td width="91%" class="forumRowHighlight">
        <a href="/admin/jobs">管理招聘</a> |
        <a href="/admin/jobs/add">发布招聘</a> |
        [<a href="javascript:location.reload()">刷新页面</a>]
      </td>
    </tr>
  </table>

  <form method="post" action="/admin/jobs/delete" id="deleteForm">
    <table width="100%" border="0" align="center" cellpadding="2" cellspacing="1" class="tableBorder">
      <tr><th class="tableHeaderText" height="25" colspan="7">招聘列表</th></tr>
      <tr height="25" class="bodytitle">
        <td width="43" align="center">ID</td>
        <td width="250" align="left"><b>职位名称</b></td>
        <td width="120" align="center"><b>工作地点</b></td>
        <td width="80" align="center"><b>人数</b></td>
        <td width="120" align="center"><b>发布时间</b></td>
        <td width="59" align="center"><b>修改</b></td>
        <td width="100" align="center"><input name="submit2" type="submit" value="删除"></td>
      </tr>
      <tbody id="jobRows">
        <tr><td colspan="7" class="forumRow" align="center">加载中...</td></tr>
      </tbody>
      <tr height="20" bgcolor="#ffffff">
        <td colspan="6" class="forumRow" align="right">&nbsp;</td>
        <td class="forumRow" align="center"><input name="button" type="button" onclick="toggleAll()" value="全选"></td>
      </tr>
      <tr height="20" bgcolor="#ffffff">
        <td class="forumrowHighLight" align="center" colspan="7" id="pagination">
          第 1 / 1 页，共 0 条
        </td>
      </tr>
    </table>
  </form>

  <script>
    let checkFlag = false;
    function toggleAll() {
      const checkboxes = document.querySelectorAll('input[name="selJob"]');
      checkFlag = !checkFlag;
      checkboxes.forEach(cb => cb.checked = checkFlag);
    }

    async function loadJobs() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || 1;
        const limit = 20;

        const response = await fetch(`/api/jobs?page=${page}&limit=${limit}`);
        const data = await response.json();

        if (!data.success || !data.data) {
          throw new Error('加载失败');
        }

        renderJobs(data.data, page, limit);
      } catch (error) {
        document.getElementById('jobRows').innerHTML =
          '<tr><td colspan="7" class="forumRow" align="center" style="color:red;">加载失败：' + error.message + '</td></tr>';
      }
    }

    function renderJobs(jobs, page, limit) {
      const tbody = document.getElementById('jobRows');

      if (jobs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="forumRow" align="center">暂无招聘信息</td></tr>';
        return;
      }

      const rows = jobs.map(item => `
        <tr height="20">
          <td align="center" class="forumRow">${item.id}</td>
          <td align="left" class="forumRow">&nbsp;${escapeHtml(item.title || '')}</td>
          <td align="center" class="forumRow">${escapeHtml(item.location || '')}</td>
          <td align="center" class="forumRow">${item.num_positions || 1}</td>
          <td align="center" class="forumRow">${escapeHtml(item.created_at || '')}</td>
          <td align="center" class="forumRow"><a href="/admin/jobs/edit?id=${item.id}">修改</a></td>
          <td align="center" class="forumRow"><input type="checkbox" name="selJob" value="${item.id}"></td>
        </tr>
      `).join('');

      tbody.innerHTML = rows;
      document.getElementById('pagination').innerHTML = `第 ${page} 页，显示 ${jobs.length} 条`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('deleteForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const selected = Array.from(document.querySelectorAll('input[name="selJob"]:checked'))
        .map(cb => cb.value);

      if (selected.length === 0) {
        alert('请选择要删除的招聘信息');
        return;
      }

      if (!confirm(`确定要删除选中的 ${selected.length} 条招聘信息吗？`)) {
        return;
      }

      try {
        const promises = selected.map(id =>
          fetch(`/api/jobs/${id}`, { method: 'DELETE' })
        );
        await Promise.all(promises);
        alert('删除成功');
        loadJobs();
      } catch (error) {
        alert('删除失败：' + error.message);
      }
    });

    loadJobs();
  </script>
</body>
</html>
